<ion-content [fullscreen]="true" scroll-y="true">

  <div class="ion-padding">
    <ion-list>
      <ion-item>
        <ion-input label="Title" [(ngModel)]="book.name" [readonly]="isDeleteAction"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Location Coordinates</ion-label>
        <ion-input
          [value]="book.latitude ? book.latitude + ', ' + book.longitude : 'No Location Selected'"
          [readonly]="true"
        ></ion-input>

        <ion-button
          *ngIf="!isDeleteAction"
          slot="end"
          (click)="openMapModal()"
          fill="clear"
          color="primary"
        >
          <ion-icon name="locate-outline" slot="icon-only"></ion-icon>
        </ion-button>

      </ion-item>
      <ion-item>
        <ion-input label="Author" [(ngModel)]="book.author" [readonly]="isDeleteAction"></ion-input>
      </ion-item>
      <ion-item>
        <ion-checkbox label-placement="end" [(ngModel)]="book.stars" [disabled]="isDeleteAction">Read Status
        </ion-checkbox>
      </ion-item>
      <ion-item>
        <ion-input label="Publishing Date" [(ngModel)]="book.publishing_date"
                   [readonly]="isDeleteAction"></ion-input>
      </ion-item>
      <ion-item>
        <ion-datetime [(ngModel)]="book.publishing_date" [readonly]="isDeleteAction"></ion-datetime>
      </ion-item>
    </ion-list>

    <ion-button *ngIf="!isDeleteAction" (click)="updateBook()" >Update</ion-button>
    <ion-button color="danger" *ngIf="isDeleteAction" (click)="deleteBook()">Delete</ion-button>
  </div>

</ion-content>
